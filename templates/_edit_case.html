<details class="mt-3">
  <summary class="btn btn-sm btn-outline-secondary">Изменить дело</summary>
  <form method="get" action="{{ url_for('main.edit_case', case_id=case.id) }}" class="mt-3 p-3 border rounded bg-light" data-draft-key="case-edit-{{ case.id }}">
    <div class="form-group">
      <label for="edit-title-{{ case.id }}">Название дела</label>
      <input class="form-control" id="edit-title-{{ case.id }}" name="title" value="{{ case.title }}" required>
    </div>
    <div class="form-group">
      <label for="edit-description-{{ case.id }}">Описание</label>
      <textarea class="form-control" id="edit-description-{{ case.id }}" name="description" rows="3">{{ case.description }}</textarea>
    </div>
    <div class="form-group">
      <label for="edit-promised-on-{{ case.id }}">Дата обещания</label>
      <input type="date" class="form-control" id="edit-promised-on-{{ case.id }}" name="promised_on" value="{{ case.promised_on }}" required>
    </div>
    <div class="form-group">
      <label for="edit-due-on-{{ case.id }}">Срок завершения</label>
      <input type="date" class="form-control" id="edit-due-on-{{ case.id }}" name="due_on" value="{{ case.due_on }}" required>
    </div>
    <div class="form-group">
      <label for="edit-status-{{ case.id }}">Статус</label>
      <select class="custom-select" id="edit-status-{{ case.id }}" name="status">
        <option value="open" {% if case.status == 'open' %}selected{% endif %}>Открыто</option>
        <option value="closed" {% if case.status == 'closed' %}selected{% endif %}>Закрыто</option>
      </select>
    </div>
    <button type="submit" class="btn btn-sm btn-success">Сохранить изменения</button>
  </form>
</details>
