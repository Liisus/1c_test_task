<details class="case-comments mt-3">
  <summary class="text-primary">Комментарии ({{ case.comments | length }})</summary>
  {% for comment in case.comments %}
    <div class="border-left pl-3 mt-3" id="comment-{{ comment.id }}" data-comment-id="{{ comment.id }}" data-case-id="{{ comment.case_id }}">
      <small class="text-secondary">Комментарий #{{ comment.id }} · <time datetime="{{ comment.created_at }}">{{ comment.created_at }}</time></small>
      <p class="mb-0 comment-body">{{ comment.body }}</p>
      {% include "_edit_comment.html" %}
    </div>
  {% else %}
    <p class="text-secondary mt-2 mb-0">Комментариев пока нет.</p>
  {% endfor %}
</details>
<details class="mt-3">
  <summary class="btn btn-sm btn-outline-primary">Добавить комментарий</summary>
  <form method="get" action="{{ url_for('main.add_comment', case_id=case.id) }}" class="mt-3" data-draft-key="comment-add-{{ case.id }}">
    <div class="form-group">
      <label for="comment-body-{{ case.id }}">Текст комментария к делу #{{ case.id }}</label>
      <textarea class="form-control" id="comment-body-{{ case.id }}" name="body" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-sm btn-success">Сохранить комментарий</button>
  </form>
</details>
