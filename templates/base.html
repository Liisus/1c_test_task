<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Дневник обещаний{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body class="bg-light">
    <header class="border-bottom bg-white">
      <nav class="navbar container py-3" aria-label="Основная навигация">
        <a class="navbar-brand font-weight-bold" href="{{ url_for('main.index') }}">Дневник обещаний</a>
      </nav>
    </header>
    <main class="container py-5" id="main">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/drafts.js') }}" defer></script>
  </body>
</html>
