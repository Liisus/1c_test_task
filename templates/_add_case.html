<details class="mb-4">
  <summary class="btn btn-primary">Добавить дело</summary>
  <form method="get" action="{{ url_for('main.add_case') }}" class="mt-3 p-3 border rounded bg-light" data-draft-key="case-add">
    <div class="form-group">
      <label for="new-title">Название дела</label>
      <input class="form-control" id="new-title" name="title" required>
    </div>
    <div class="form-group">
      <label for="new-description">Описание</label>
      <textarea class="form-control" id="new-description" name="description" rows="3"></textarea>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="new-promised-on">Дата обещания</label>
        <input type="date" class="form-control" id="new-promised-on" name="promised_on" required>
      </div>
      <div class="col-md-6">
        <label for="new-due-on">Срок завершения</label>
        <input type="date" class="form-control" id="new-due-on" name="due_on" required>
      </div>
    </div>
    <button type="submit" class="btn btn-success">Сохранить дело</button>
  </form>
</details>
